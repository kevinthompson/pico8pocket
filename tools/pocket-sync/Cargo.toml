[package]
name = "pocket-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
crc32fast = "=1.5.0"
png = "=0.17.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "=1.3.0"
extism-pdk-derive = "=1.3.0"

[profile.release]
lto = true
opt-level = "s"
strip = true
