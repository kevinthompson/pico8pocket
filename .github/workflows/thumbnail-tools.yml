name: Build and verify distribution
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching dist/core/core.json (vMAJOR.MINOR.PATCH), required for a draft
        default: ''
        type: string
      create_draft:
        description: Create a complete draft release after all checks pass
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned WASM toolchains
        run: |
          curl -fL -o "$RUNNER_TEMP/tinygo.tar.gz" https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo0.43.0.linux-amd64.tar.gz
          echo "ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a  $RUNNER_TEMP/tinygo.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          curl -fL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Check packaged AI disclosure
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: make thumbnail-tools
      - name: Test compiled Pocket Sync plugin
        env:
          REQUIRE_PLUGIN_TESTS: '1'
          POCKET_PLUGIN_WASM: ${{ github.workspace }}/build/thumbnail-tools/plugin.wasm
          CART_THUMBNAILS_WASM: ${{ github.workspace }}/build/thumbnail-tools/cart-thumbnails.wasm
        run: go test ./integration -count=1
      - uses: actions/upload-artifact@v7
        with:
          name: thumbnail-tools
          path: build/thumbnail-tools/*
          if-no-files-found: error
  core:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_LOCAL_CARTS: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned core compiler and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf=13.2.0-11ubuntu1+12 binutils-riscv64-unknown-elf build-essential jq zip rsync
      - name: Fetch matched dependencies, then run host regressions
        run: |
          make deps
          make test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and validate the public core package
        run: |
          make package USE_SDK_CONTAINER=0 CROSS=riscv64-unknown-elf-
          version=$(jq -er '.core.metadata.version' dist/core/core.json)
          mkdir -p build/core-artifacts
          cp "releases/pico8pocket-v${version}.zip" build/core-artifacts/
          python3 scripts/release.py provenance \
            --core "build/core-artifacts/pico8pocket-v${version}.zip" \
            --out build/core-artifacts/CORE-PROVENANCE.json \
            --compiler "$(riscv64-unknown-elf-gcc -dumpfullversion)"
      - uses: actions/upload-artifact@v7
        with:
          name: release-core
          path: build/core-artifacts/*
          if-no-files-found: error
  distribution:
    needs: [native, wasm, core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: build/core-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: thumbnail-tools
          path: build/thumbnail-tools
      - name: Verify complete core and tool assets with provenance and checksums
        run: |
          python3 scripts/release.py assemble --core-dir build/core-artifacts --tools build/thumbnail-tools
          cd build/distribution
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: pico8pocket-distribution
          path: build/distribution/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Require explicit version matching the tested core
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = os.environ['VERSION']
          expected = 'v' + json.load(open('dist/core/core.json'))['core']['metadata']['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', version) or version != expected:
              raise SystemExit('Draft version must match dist/core/core.json')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: pico8pocket-distribution
          path: build/distribution
      - name: Create complete draft for manual publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          cd build/distribution
          sha256sum -c SHA256SUMS
          # Atomically bind a fresh tag to the tested commit. --target alone
          # would silently reuse an existing tag, even at a different commit.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            --raw-field "ref=refs/tags/$VERSION" --raw-field "sha=$GITHUB_SHA"
          gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --notes '' ./*
